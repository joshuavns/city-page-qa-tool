<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>City Page QA Checker — Ring Ring Marketing</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #1f2933; --muted: #6b7280;
    --line: #e2e8f0; --brand: #2563eb;
    --err-bg: #fdecea; --err: #b42318; --warn-bg: #fef6e7; --warn: #92600a;
    --ok-bg: #e7f6ec; --ok: #1a7f3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 24px; }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1040px; margin: 24px auto; padding: 0 20px; display: grid;
         grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
          margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
                     border-radius: 6px; font-size: 14px; }
  textarea { width: 100%; min-height: 360px; padding: 10px; border: 1px solid var(--line);
             border-radius: 6px; font: 13px/1.45 ui-monospace, Consolas, monospace; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { margin-top: 14px; width: 100%; padding: 11px; background: var(--brand); color: #fff;
           border: 0; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .mode { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .check { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .check > .head { padding: 10px 14px; font-weight: 600; display: flex; justify-content: space-between;
                   align-items: center; }
  .check.pass > .head { background: var(--ok-bg); color: var(--ok); }
  .check.warn > .head { background: var(--warn-bg); color: var(--warn); }
  .check.err  > .head { background: var(--err-bg); color: var(--err); }
  .check .body { padding: 10px 14px; font-size: 13.5px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(0,0,0,.06); }
  .finding { padding: 6px 0; border-top: 1px dashed var(--line); }
  .finding:first-child { border-top: 0; }
  .finding.error  { color: var(--err); }
  .finding.warning{ color: var(--warn); }
  .finding.ok     { color: var(--ok); }
  .snippet { display: block; margin-top: 3px; padding: 5px 8px; background: #f8fafc;
             border-left: 3px solid var(--line); color: var(--ink); font: 12px ui-monospace, monospace;
             white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  td.off { color: var(--err); font-weight: 600; }
  td.good { color: var(--ok); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>City Page QA Checker</h1>
  <p>Paste a generated city page (section-tagged or Word-doc text) and flag the issues that matter. Runs entirely in your browser — nothing is uploaded.</p>
</header>

<main>
  <section class="card">
    <h2>Input</h2>
    <div class="row2">
      <div>
        <label for="keyword">Target keyword (exact match)</label>
        <input type="text" id="keyword" placeholder="e.g. home care services in Kennewick, WA" />
      </div>
      <div>
        <label for="city">Target city</label>
        <input type="text" id="city" placeholder="e.g. Kennewick" />
      </div>
    </div>
    <label for="business">Business name (optional — enables CTA/section name checks)</label>
    <input type="text" id="business" placeholder="e.g. Affordable at Home Care" />

    <label for="content">Pasted city page content</label>
    <textarea id="content" placeholder="Paste the full city page output here..."></textarea>
    <p class="mode" id="mode"></p>
    <button id="run">Run QA Check</button>
  </section>

  <section class="card">
    <h2>Results</h2>
    <div id="results"><div class="empty">Paste content and click “Run QA Check”.</div></div>
  </section>
</main>

<script>
"use strict";

// ---- helpers ---------------------------------------------------------------
const PHONE_RE = /(\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4})/;

function countOccurrences(text, term) {
  if (!term || !term.trim()) return 0;
  const t = (text || "").toLowerCase();
  const k = term.toLowerCase();
  let count = 0, pos = 0;
  while ((pos = t.indexOf(k, pos)) !== -1) { count++; pos += k.length; }
  return count;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// Parse [SECTION]...[/SECTION] blocks (the generator's native format)
function parseSections(text) {
  const sections = {};
  const re = /\[([A-Z_0-9]+)\]([\s\S]*?)\[\/\1\]/g;
  let m;
  while ((m = re.exec(text)) !== null) sections[m[1]] = m[2].trim();
  return sections;
}

// Find the meta title in either format
function findMetaTitle(text, sections) {
  if (sections.META) {
    const m = sections.META.match(/^META_TITLE:\s*(.+)$/m);
    if (m) return m[1].trim();
  }
  const m = text.match(/^\s*Meta\s*Title:\s*(.+)$/mi);
  return m ? m[1].trim() : "";
}

// Collect CTA texts from either format
function findCtas(text, sections) {
  const ctas = [];
  ["CTA_1", "CTA_2", "CTA_3"].forEach(k => {
    if (sections[k]) ctas.push({ label: k, text: sections[k] });
  });
  if (ctas.length === 0) {
    const re = /<CTA Button>([\s\S]*?)<\/CTA Button>/gi;
    let m, i = 1;
    while ((m = re.exec(text)) !== null) ctas.push({ label: "CTA " + (i++), text: m[1].trim() });
  }
  return ctas;
}

// ---- checks ----------------------------------------------------------------
function checkKeyword(text, sections, keyword, metaTitle) {
  const findings = [];
  if (!keyword.trim()) {
    return { status: "warn", findings: [{ sev: "warning", msg: "No target keyword entered — skipped." }] };
  }
  const total = countOccurrences(text, keyword);
  const inTitle = countOccurrences(metaTitle, keyword);
  const outside = total - inTitle;

  if (inTitle === 0) {
    findings.push({ sev: "warning", msg: "Exact keyword was NOT found in the Meta Title (it must appear there)." });
  } else {
    findings.push({ sev: "ok", msg: "Exact keyword present in the Meta Title." });
  }

  if (outside > 0) {
    const where = [];
    if (Object.keys(sections).length) {
      for (const [key, val] of Object.entries(sections)) {
        let c = countOccurrences(val, keyword);
        if (key === "META") c -= inTitle; // don't double-count the title itself
        if (c > 0) where.push(`${key} (${c})`);
      }
    }
    findings.push({
      sev: "error",
      msg: `Exact keyword appears ${outside} time(s) OUTSIDE the Meta Title. It must appear in the Meta Title only — use natural variations elsewhere.`,
      detail: where.length ? "Found in: " + where.join(", ") : null
    });
  } else {
    findings.push({ sev: "ok", msg: "Exact keyword does not appear outside the Meta Title." });
  }
  return { status: outside > 0 ? "err" : (inTitle === 0 ? "warn" : "pass"), findings };
}

const CITY_TARGETS = { INTRO: 3, SGE_AIO: 3, SERVICES: 6, WHY_CHOOSE_US: 4, GBP_REVIEW: 2, CLOSING: 4 };
const CITY_TOTAL = 25;

function checkCityStructured(sections, city) {
  const findings = [];
  const rows = [];
  let total = 0;

  for (const [key, target] of Object.entries(CITY_TARGETS)) {
    const c = sections[key] ? countOccurrences(sections[key], city) : 0;
    total += c;
    rows.push({ label: key, actual: c, target });
  }

  // FAQ: headings count toward total (target 3); answer bodies must be 0
  let faqHeadings = 0, faqAnswers = 0;
  if (sections.FAQ) {
    let inAnswer = false;
    for (const line of sections.FAQ.split("\n")) {
      const s = line.trim();
      if (s.startsWith("H3:")) { faqHeadings += countOccurrences(s, city); inAnswer = true; }
      else if (s.startsWith("H2:")) { faqHeadings += countOccurrences(s, city); inAnswer = false; }
      else if (inAnswer && s) faqAnswers += countOccurrences(s, city);
    }
  }
  total += faqHeadings;
  rows.push({ label: "FAQ headings", actual: faqHeadings, target: 3 });

  if (faqAnswers > 0) {
    findings.push({ sev: "error", msg: `City name appears ${faqAnswers} time(s) in FAQ answer bodies — must be ZERO.` });
  }

  const tableRows = rows.map(r =>
    `<tr><td>${r.label}</td><td class="${r.actual === r.target ? "good" : "off"}">${r.actual}</td><td>${r.target}</td></tr>`
  ).join("");
  const table = `<table><tr><th>Section</th><th>Found</th><th>Target</th></tr>${tableRows}</table>`;

  if (total !== CITY_TOTAL) {
    findings.unshift({
      sev: "error",
      msg: `City "${city}" appears ${total} time(s) in body content — ${Math.abs(total - CITY_TOTAL)} ${total > CITY_TOTAL ? "OVER" : "UNDER"} the required ${CITY_TOTAL}. (CTAs, Meta, and Image blocks are excluded.)`,
      html: table
    });
  } else {
    findings.unshift({ sev: "ok", msg: `City total is exactly ${CITY_TOTAL} across body content.`, html: table });
  }

  const status = (total !== CITY_TOTAL || faqAnswers > 0) ? "err" : "pass";
  return { status, findings };
}

function checkCityDocument(text, city) {
  // Approximate body count: strip CTAs, meta lines, image-alt markers, then count.
  let body = text
    .replace(/<CTA Button>[\s\S]*?<\/CTA Button>/gi, " ")
    .replace(/<Image Alt>[\s\S]*?<\/Image Alt>/gi, " ")
    .replace(/^\s*(Meta\s*Title|Meta\s*Description|URL|Download all images):.*$/gim, " ");
  const bodyCount = countOccurrences(body, city);
  const totalAll = countOccurrences(text, city);

  const findings = [{
    sev: "warning",
    msg: `Document-mode (no [SECTION] tags): per-section breakdown unavailable. Approx. body-content mentions of "${city}": ${bodyCount} (target ${CITY_TOTAL}). Total in whole paste incl. CTAs/meta: ${totalAll}.`
  }];
  let status = "warn";
  if (bodyCount > CITY_TOTAL + 1) { findings.push({ sev: "error", msg: `Likely OVER the ${CITY_TOTAL} cap.` }); status = "err"; }
  return { status, findings };
}

function checkCtas(ctas, businessName) {
  if (ctas.length === 0) {
    return { status: "warn", findings: [{ sev: "warning", msg: "No CTAs detected. (Expecting [CTA_1..3] tags or <CTA Button> markers.)" }] };
  }
  const findings = [];
  let worst = "pass";
  ctas.forEach(cta => {
    const local = [];
    const phone = cta.text.match(PHONE_RE);
    if (!phone) { local.push({ sev: "error", msg: "No phone number found." }); worst = "err"; }
    else {
      const before = cta.text.slice(0, phone.index).trim();
      const words = before ? before.split(/\s+/).filter(Boolean).length : 0;
      if (words > 10) { local.push({ sev: "warning", msg: `${words} words before the phone number (aim ≤ 10).` }); if (worst === "pass") worst = "warn"; }
    }
    const totalWords = cta.text.trim().split(/\s+/).filter(Boolean).length;
    if (totalWords > 25) { local.push({ sev: "warning", msg: `CTA is ${totalWords} words — may be too long.` }); if (worst === "pass") worst = "warn"; }
    if (businessName.trim() && countOccurrences(cta.text, businessName) > 0) {
      local.push({ sev: "error", msg: "Business name appears in this CTA (it must not)." }); worst = "err";
    }
    if (local.length === 0) local.push({ sev: "ok", msg: "Short and includes a phone number." });
    findings.push({ sev: local.some(f => f.sev === "error") ? "error" : local.some(f => f.sev === "warning") ? "warning" : "ok",
                    msg: `${cta.label}: ${cta.text}`, sub: local });
  });
  return { status: worst, findings };
}

function snippetsAround(text, regex, maxShow) {
  const out = [];
  const re = new RegExp(regex.source, regex.flags.includes("g") ? regex.flags : regex.flags + "g");
  let m;
  while ((m = re.exec(text)) !== null) {
    const start = Math.max(0, m.index - 30);
    const end = Math.min(text.length, m.index + m[0].length + 30);
    out.push("…" + text.slice(start, end).replace(/\s+/g, " ").trim() + "…");
    if (out.length >= (maxShow || 10)) break;
    if (m.index === re.lastIndex) re.lastIndex++;
  }
  return out;
}

function checkEmDashes(text) {
  const findings = [];
  const em = snippetsAround(text, /—/, 12);   // — em-dash
  const en = snippetsAround(text, /–/, 12);   // – en-dash
  if (em.length)
    findings.push({ sev: "error", msg: `Found ${em.length}${em.length >= 12 ? "+" : ""} em-dash(es) (—). Replace with a comma or a hyphen.`, detail: em.join("\n") });
  if (en.length)
    findings.push({ sev: "warning", msg: `Found ${en.length}${en.length >= 12 ? "+" : ""} en-dash(es) (–). These should not appear either — use a hyphen.`, detail: en.join("\n") });
  if (!em.length && !en.length)
    findings.push({ sev: "ok", msg: "No em-dashes or en-dashes found." });
  return { status: em.length ? "err" : en.length ? "warn" : "pass", findings };
}

function checkBusinessName(sections, structured, businessName) {
  if (!businessName.trim())
    return { status: "warn", findings: [{ sev: "warning", msg: "No business name entered — skipped." }] };
  if (!structured)
    return { status: "warn", findings: [{ sev: "warning", msg: "Per-section placement needs [SECTION] tags — skipped in document mode." }] };

  const findings = [];
  let worst = "pass";
  const onceIn = [["INTRO", "Intro"], ["SGE_AIO", "SGE/AIO"], ["WHY_CHOOSE_US", "Why Choose Us"], ["CLOSING", "Closing"]];
  for (const [key, label] of onceIn) {
    if (!(key in sections)) continue;
    const c = countOccurrences(sections[key], businessName);
    if (c === 0) { findings.push({ sev: "warning", msg: `${label}: business name missing — should appear exactly once.` }); if (worst === "pass") worst = "warn"; }
    else if (c > 1) { findings.push({ sev: "warning", msg: `${label}: business name appears ${c} times — should be once.` }); if (worst === "pass") worst = "warn"; }
    else findings.push({ sev: "ok", msg: `${label}: business name appears once.` });
  }
  if (sections.META) {
    const md = (sections.META.match(/^META_DESCRIPTION:\s*(.+)$/m) || [])[1] || "";
    if (md) {
      const c = countOccurrences(md, businessName);
      if (c === 0) { findings.push({ sev: "warning", msg: "Meta Description: business name missing — should appear once." }); if (worst === "pass") worst = "warn"; }
      else findings.push({ sev: "ok", msg: "Meta Description: business name present." });
    }
  }
  if (sections.SERVICES) {
    const c = countOccurrences(sections.SERVICES, businessName);
    if (c > 0) { findings.push({ sev: "error", msg: `Services: business name appears ${c} time(s) — it must NOT appear here.` }); worst = "err"; }
    else findings.push({ sev: "ok", msg: "Services: no business name (correct)." });
  }
  return { status: worst, findings };
}

function checkPhoneOutsideCtas(text, sections, structured) {
  const PHONE_G = /(\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4})/g;
  let searchText;
  if (structured) {
    searchText = Object.entries(sections).filter(([k]) => !/^CTA_/.test(k)).map(([, v]) => v).join("\n");
  } else {
    searchText = text.replace(/<CTA Button>[\s\S]*?<\/CTA Button>/gi, " ");
  }
  const snips = snippetsAround(searchText, PHONE_G, 10);
  if (snips.length)
    return { status: "err", findings: [{ sev: "error", msg: `Phone number found OUTSIDE CTA blocks in ${snips.length} place(s). Phone numbers belong in CTAs only.`, detail: snips.join("\n") }] };
  return { status: "pass", findings: [{ sev: "ok", msg: "No phone numbers outside CTA blocks." }] };
}

// ---- render ----------------------------------------------------------------
function renderCheck(title, result) {
  const cls = result.status;
  const badge = cls === "pass" ? "PASS" : cls === "warn" ? "REVIEW" : "ISSUES";
  let body = "";
  result.findings.forEach(f => {
    if (f.sub) {
      body += `<div class="finding ${f.sev}">${escapeHtml(f.msg.split(":")[0])}<span class="snippet">${escapeHtml(f.msg.substring(f.msg.indexOf(":") + 1).trim())}</span>`;
      f.sub.forEach(s => { body += `<div class="finding ${s.sev}" style="padding-left:10px">• ${escapeHtml(s.msg)}</div>`; });
      body += `</div>`;
    } else {
      body += `<div class="finding ${f.sev}">${escapeHtml(f.msg)}`;
      if (f.detail) body += `<span class="snippet">${escapeHtml(f.detail)}</span>`;
      if (f.html) body += f.html;
      body += `</div>`;
    }
  });
  return `<div class="check ${cls}"><div class="head"><span>${title}</span><span class="badge">${badge}</span></div><div class="body">${body}</div></div>`;
}

document.getElementById("run").addEventListener("click", () => {
  const text = document.getElementById("content").value;
  const keyword = document.getElementById("keyword").value;
  const city = document.getElementById("city").value;
  const business = document.getElementById("business").value;
  const out = document.getElementById("results");

  if (!text.trim()) { out.innerHTML = `<div class="empty">Paste some content first.</div>`; return; }

  const sections = parseSections(text);
  const structured = Object.keys(sections).length > 0;
  document.getElementById("mode").textContent =
    structured ? "Detected section-tagged format — full per-section analysis." :
                 "No [SECTION] tags — running document-mode (keyword + CTA full, city approximate).";

  const metaTitle = findMetaTitle(text, sections);
  const ctas = findCtas(text, sections);

  let html = "";
  html += renderCheck("1 · Exact-match keyword (Meta Title only)", checkKeyword(text, sections, keyword, metaTitle));
  if (!city.trim()) {
    html += renderCheck("2 · City mention count", { status: "warn", findings: [{ sev: "warning", msg: "No target city entered — skipped." }] });
  } else {
    html += renderCheck("2 · City mention count", structured ? checkCityStructured(sections, city) : checkCityDocument(text, city));
  }
  html += renderCheck("3 · CTAs (short + phone number)", checkCtas(ctas, business));
  html += renderCheck("4 · Em-dashes (none allowed)", checkEmDashes(text));
  html += renderCheck("5 · Business name placement", checkBusinessName(sections, structured, business));
  html += renderCheck("6 · Phone numbers (CTAs only)", checkPhoneOutsideCtas(text, sections, structured));

  out.innerHTML = html;
});
</script>
</body>
</html>
